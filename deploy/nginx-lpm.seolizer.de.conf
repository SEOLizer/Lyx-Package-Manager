# lpm.seolizer.de — statische Lyx-Paket-Registry (siehe docs/registry.md im Repo lyx-lpm)

server {
    server_name lpm.seolizer.de;
    root /var/www/lpm;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # .lxpkg ist bereits zstd-komprimiert -> nicht doppelt komprimieren
    gzip on;
    gzip_types      text/plain text/css text/javascript application/javascript application/json application/xml;
    gzip_proxied    no-cache no-store private expired auth;
    gzip_min_length 1000;

    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Indizes aendern sich bei jedem publish -> Cloudflare darf sie nicht cachen.
    # Revalidierung laeuft ueber ETag/Last-Modified (nginx setzt beide selbst).
    location ~ /index\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Paket-Archive sind unveraenderlich: eine Version wird nie ueberschrieben.
    location ~ \.lxpkg$ {
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Publisher-Keys (TOFU, PM-10)
    location ^~ /keys/ {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Publish-API (PM-08). Nur unter /api/ laeuft PHP.
    #
    # Die API-Pfade tragen kein .php: der Client spricht /api/v1/publish an,
    # ausgeliefert wird api/v1/publish.php. Jeder Endpunkt bekommt eine eigene
    # exakte location — kein try_files. Grund: try_files beantwortet ein POST
    # auf eine statische Datei mit 405, noch bevor PHP ueberhaupt gefragt wird.
    # snippets/fastcgi-php.conf wird hier bewusst NICHT eingebunden: es enthaelt
    # ein `try_files $fastcgi_script_name =404`, und unter dieser URL gibt es
    # keine Datei namens "publish" — jeder Aufruf endete mit 404. SCRIPT_FILENAME
    # steht nach dem include, sonst setzt fastcgi.conf es wieder zurueck.
    location = /api/v1/publish {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/v1/publish.php;
        fastcgi_param SCRIPT_NAME     /api/v1/publish.php;
        fastcgi_read_timeout 60s;
    }

    # Die PHP-Dateien selbst sind nicht direkt erreichbar: die API spricht man
    # ueber die Pfade oben an, nicht ueber ihren Ablageort.
    location ^~ /api/ {
        return 404;
    }

    # Ausserhalb von /api/ wird PHP nicht ausgefuehrt, sondern verweigert --
    # sonst wuerde eine hochgeladene .php im Paketbaum zu RCE.
    location ~ \.php$ {
        return 404;
    }

    # Interne Dateien nie ausliefern
    location ~ /\. {
        deny all;
    }

    client_max_body_size 32m;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lpm.seolizer.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lpm.seolizer.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name lpm.seolizer.de;
    return 301 https://$host$request_uri;
}
